    function saveSession() {
      const title = document.getElementById('sessionTitle').value.trim();
      const startTime = document.getElementById('sessionStartTime').value;
      const endTime = document.getElementById('sessionEndTime').value;
      const type = document.getElementById('sessionType').value;
      const volunteer = document.getElementById('sessionVolunteer').value.trim();
      const description = document.getElementById('sessionDescription').value.trim();
      const showTime = document.getElementById('sessionShowTime').checked;
      const allRooms = document.getElementById('sessionAllRooms').checked;

      if (!title || !startTime || !endTime) {
        showAlert('sessionModalAlert', 'Please fill in all required fields', 'error');
        return;
      }

      if (timeToMinutes(startTime) >= timeToMinutes(endTime)) {
        showAlert('sessionModalAlert', 'End time must be after start time', 'error');
        return;
      }

      const roomIds = allRooms ? [] : Array.from(document.querySelectorAll('.room-checkbox:checked')).map(cb => parseInt(cb.value));

      if (!allRooms && roomIds.length === 0) {
        showAlert('sessionModalAlert', 'Please select at least one location or "All Locations"', 'error');
        return;
      }

      const sessions = state.sessions[state.currentDate] || [];
      const existingIndex = sessions.findIndex(s => s.id === state.selectedSession?.id);

      const sessionData = {
        id: state.selectedSession?.id || state.nextSessionId++,
        title, startTime, endTime, type, volunteer, description, showTime, allRooms, roomIds
      };

      if (existingIndex >= 0) {
        sessions[existingIndex] = sessionData;
      } else {
        sessions.push(sessionData);
      }

      if (!state.sessions[state.currentDate]) state.sessions[state.currentDate] = [];
      state.sessions[state.currentDate] = sessions;
      state.selectedSession = null;

      closeSessionModal();
      renderSchedule();
    }

    function editSession(session) {
      state.selectedSession = session;
      openSessionModal(session);
    }

    function deleteSession() {
      if (!state.selectedSession) return;

      const sessions = state.sessions[state.currentDate] || [];
      const index = sessions.findIndex(s => s.id === state.selectedSession.id);
      if (index >= 0) sessions.splice(index, 1);

      state.selectedSession = null;
      hideContextMenu();
      closeSessionModal();
      renderSchedule();
    }

    function saveRoom() {
      const name = document.getElementById('roomName').value.trim();
      const notes = document.getElementById('roomCapacity').value.trim();

      if (!name) { alert('Please enter a location name'); return; }

      const newId = state.nextRoomId++;
      state.allRooms.push({ id: newId, name, notes });
      if (!state.tabRooms[state.currentDate]) state.tabRooms[state.currentDate] = [];
      state.tabRooms[state.currentDate].push(newId);

      closeRoomModal();
      renderSchedule();
    }

    function removeRoom(roomId) {
      const tabRoomIds = state.tabRooms[state.currentDate] || [];
      if (tabRoomIds.length === 1) { alert('You must have at least one location'); return; }

      const room = getRoomById(roomId);
      if (!confirm(`Remove ${room?.name} from this tab? (The location will still be available to add back later.)`)) return;

      state.tabRooms[state.currentDate] = tabRoomIds.filter(id => id !== roomId);
      const tabSessions = state.sessions[state.currentDate] || [];
      tabSessions.forEach(session => {
        session.roomIds = session.roomIds.filter(rid => rid !== roomId);
      });

      renderSchedule();
    }

    let editingDateTab = null;

    function editDateTab(oldName) {
      editingDateTab = oldName;
      document.getElementById('dateModalTitle').textContent = 'Rename Day';
      document.getElementById('dateInput').value = oldName;
      document.getElementById('dateModal').classList.add('show');
    }

    function saveDate() {
      const dateStr = document.getElementById('dateInput').value.trim();

      if (!dateStr) {
        showAlert('dateModalAlert', 'Please enter a name', 'error');
        return;
      }

      if (editingDateTab) {
        if (dateStr !== editingDateTab && state.dates.includes(dateStr)) {
          showAlert('dateModalAlert', 'That name already exists', 'error');
          return;
        }
        const idx = state.dates.indexOf(editingDateTab);
        if (idx >= 0) {
          state.dates[idx] = dateStr;
          state.sessions[dateStr] = state.sessions[editingDateTab];
          state.tabRooms[dateStr] = state.tabRooms[editingDateTab];
          state.dayStartHour[dateStr] = state.dayStartHour[editingDateTab];
          state.dayEndHour[dateStr] = state.dayEndHour[editingDateTab];
          if (dateStr !== editingDateTab) {
            delete state.sessions[editingDateTab];
            delete state.tabRooms[editingDateTab];
            delete state.dayStartHour[editingDateTab];
            delete state.dayEndHour[editingDateTab];
          }
          if (state.currentDate === editingDateTab) state.currentDate = dateStr;
        }
        editingDateTab = null;
      } else {
        if (state.dates.includes(dateStr)) {
          showAlert('dateModalAlert', 'That name already exists', 'error');
          return;
        }
        state.dates.push(dateStr);
        if (!state.sessions[dateStr]) state.sessions[dateStr] = [];
        if (state.allRooms.length === 0) {
          const newId = state.nextRoomId++;
          state.allRooms.push({ id: newId, name: 'Location 1', notes: '' });
          state.tabRooms[dateStr] = [newId];
        } else {
          state.tabRooms[dateStr] = state.allRooms.map(r => r.id);
        }
        state.currentDate = dateStr;
      }

      closeDateModal();
      renderDateTabs();
      renderSchedule();
    }

    function duplicateDay(sourceDate) {
      let newName = sourceDate + ' (copy)';
      let counter = 2;
      while (state.dates.includes(newName)) {
        newName = sourceDate + ` (copy ${counter})`;
        counter++;
      }
      const name = prompt('Name for the duplicate day:', newName);
      if (!name || !name.trim()) return;
      const trimmed = name.trim();
      if (state.dates.includes(trimmed)) {
        alert('A day with that name already exists.');
        return;
      }

      // Deep copy sessions
      const sourceSessions = state.sessions[sourceDate] || [];
      const copiedSessions = sourceSessions.map(s => ({
        ...s,
        id: state.nextSessionId++,
        roomIds: [...s.roomIds]
      }));

      // Copy room assignments
      const sourceRooms = state.tabRooms[sourceDate] || [];

      state.dates.push(trimmed);
      state.sessions[trimmed] = copiedSessions;
      state.tabRooms[trimmed] = [...sourceRooms];
      if (state.dayStartHour[sourceDate] != null) state.dayStartHour[trimmed] = state.dayStartHour[sourceDate];
      if (state.dayEndHour[sourceDate] != null) state.dayEndHour[trimmed] = state.dayEndHour[sourceDate];
      state.currentDate = trimmed;

      renderDateTabs();
      renderSchedule();
    }

    function removeDate(date) {
      if (state.dates.length === 1) { alert('You must have at least one day'); return; }
      if (!confirm(`Remove ${date}?`)) return;

      state.dates = state.dates.filter(d => d !== date);
      delete state.sessions[date];
      delete state.tabRooms[date];
      delete state.dayStartHour[date];
      delete state.dayEndHour[date];
      state.currentDate = state.dates[0];

      renderDateTabs();
      renderSchedule();
    }

    function deleteSessionType(typeId) {
      if (!confirm(`Delete "${state.sessionTypes[typeId].label}"?`)) return;

      delete state.sessionTypes[typeId];
      Object.values(state.sessions).forEach(sessions => {
        sessions.forEach(session => {
          if (session.type === typeId) session.type = Object.keys(state.sessionTypes)[0] || 'event-type-1';
        });
      });

      renderSessionTypes();
      renderSchedule();
    }

    function addSessionType() {
      const name = document.getElementById('newTypeName').value.trim();
      const color = document.getElementById('newTypeColor').value;
      if (!name) { alert('Please enter a type name'); return; }

      const typeId = name.toLowerCase().replace(/\s+/g, '-');
      if (state.sessionTypes[typeId]) { alert('This type already exists'); return; }

      state.sessionTypes[typeId] = { label: name, color };
      document.getElementById('newTypeName').value = '';
      document.getElementById('newTypeColor').value = '#3498db';

      renderSessionTypes();
      renderSessionTypeSelect();
    }

    // App title editing
    document.getElementById('appTitle').onclick = () => {
      const titleEl = document.getElementById('appTitle');
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'header-title-input';
      input.value = state.appName;

      const finishEdit = () => {
        const val = input.value.trim() || 'Untitled Schedule';
        state.appName = val;
        titleEl.textContent = val;
        document.title = val;
        titleEl.style.display = '';
        input.remove();
      };

      input.onblur = finishEdit;
      input.onkeydown = (e) => {
        if (e.key === 'Enter') finishEdit();
        if (e.key === 'Escape') { input.value = state.appName; finishEdit(); }
      };

      titleEl.style.display = 'none';
      titleEl.parentElement.insertBefore(input, titleEl);
      input.focus();
      input.select();
    };

    // File menu
    function closeAllMenus() {
      document.querySelectorAll('.menu-dropdown').forEach(m => m.classList.remove('show'));
    }

    document.getElementById('fileMenuBtn').onclick = (e) => {
      e.stopPropagation();
      const dropdown = document.getElementById('fileMenuDropdown');
      const isOpen = dropdown.classList.contains('show');
      closeAllMenus();
      if (!isOpen) dropdown.classList.add('show');
    };

    document.addEventListener('click', () => closeAllMenus());

    function newSchedule() {
      if (currentUser) {
        newScheduleCloud();
      } else {
        if (!confirm('Start a new schedule? Any unsaved changes will be lost.')) return;
        newScheduleLocal();
      }
    }

    function saveJSON() {
      const data = {
        version: 3,
        appName: state.appName,
        dayStartHour: state.dayStartHour,
        dayEndHour: state.dayEndHour,
        dates: state.dates,
        allRooms: state.allRooms,
        tabRooms: state.tabRooms,
        sessions: state.sessions,
        sessionTypes: state.sessionTypes
      };

      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const safeName = state.appName.replace(/[^a-zA-Z0-9-_ ]/g, '').replace(/\s+/g, '-');
      a.download = `${safeName}-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function makeCopy() {
      // File-based copy: download JSON
      state.appName = state.appName + ' (copy)';
      document.getElementById('appTitle').textContent = state.appName;
      document.title = state.appName;
      saveJSON();
    }

    function loadJSON() {
      document.getElementById('fileInput').click();
    }

    document.getElementById('fileInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);

          state.appName = data.appName || 'Untitled Schedule';
          // Per-day time ranges (migrate from old single-value format)
          if (data.dayStartHour) {
            state.dayStartHour = data.dayStartHour;
            state.dayEndHour = data.dayEndHour || {};
          } else {
            const sh = (data.startHour != null) ? data.startHour : 7;
            const eh = (data.endHour != null) ? data.endHour : 22;
            state.dayStartHour = {};
            state.dayEndHour = {};
            (data.dates || ['Day 1']).forEach(d => {
              state.dayStartHour[d] = sh;
              state.dayEndHour[d] = eh;
            });
          }
          state.dates = data.dates || ['Day 1'];
          state.sessions = data.sessions || {};
          state.sessionTypes = data.sessionTypes || { ...BUILT_IN_TYPES };

          if (data.version >= 2 && data.allRooms) {
            state.allRooms = data.allRooms;
            state.tabRooms = data.tabRooms || {};
          } else if (data.rooms) {
            const allRoomsMap = {};
            Object.values(data.rooms).forEach(roomArr => {
              (roomArr || []).forEach(room => {
                if (!allRoomsMap[room.id]) allRoomsMap[room.id] = room;
              });
            });
            state.allRooms = Object.values(allRoomsMap);
            state.tabRooms = {};
            Object.entries(data.rooms).forEach(([tab, roomArr]) => {
              state.tabRooms[tab] = (roomArr || []).map(r => r.id);
            });
          }

          // Migrate old 'capacity' field to 'notes'
          state.allRooms.forEach(r => {
            if (r.capacity !== undefined && r.notes === undefined) {
              r.notes = r.capacity;
              delete r.capacity;
            }
            if (r.notes === undefined) r.notes = '';
          });

          const maxRoomId = state.allRooms.reduce((max, r) => Math.max(max, r.id), 0);
          state.nextRoomId = Math.max(state.nextRoomId, maxRoomId + 1);

          const maxSessionId = Object.values(state.sessions).flat().reduce((max, s) => Math.max(max, s.id || 0), 0);
          state.nextSessionId = Math.max(state.nextSessionId, maxSessionId + 1);

          state.currentDate = state.dates[0];

          document.getElementById('appTitle').textContent = state.appName;
          document.title = state.appName;

          renderDateTabs();
          renderSchedule();

          alert('Schedule loaded successfully!');
        } catch (err) {
          alert('Error loading file: ' + err.message);
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    };

    // Wire up buttons
    document.getElementById('addSessionBtn').onclick = () => {
      state.selectedSession = null;
      openSessionModal();
    };

    document.getElementById('saveSessionBtn').onclick = saveSession;
    document.getElementById('cancelSessionBtn').onclick = closeSessionModal;
    document.getElementById('closeSessionModal').onclick = closeSessionModal;
    document.getElementById('deleteSessionBtn').onclick = () => {
      if (state.selectedSession && confirm('Delete this event?')) {
        deleteSession();
      }
    };

    document.getElementById('manageRoomsBtn').onclick = openManageRoomsModal;
    document.getElementById('closeManageRoomsModal').onclick = closeManageRoomsModal;
    document.getElementById('addNewRoomBtn').onclick = addRoomFromManage;

    document.getElementById('addDateBtn').onclick = openDateModal;
    document.getElementById('saveDateBtn').onclick = saveDate;
    document.getElementById('cancelDateBtn').onclick = closeDateModal;
    document.getElementById('closeDateModal').onclick = closeDateModal;

    document.getElementById('manageColorsBtn').onclick = openColorsModal;
    document.getElementById('closeColorsModal').onclick = closeColorsModal;
    document.getElementById('addTypeBtn').onclick = addSessionType;

    document.getElementById('newBtn').onclick = newSchedule;
    document.getElementById('openBtn').onclick = loadJSON;
    document.getElementById('saveBtn').onclick = saveJSON;
    document.getElementById('openCloudBtn').onclick = () => { closeAllMenus(); openSchedulesModal(); };
    document.getElementById('saveCloudBtn').onclick = () => { closeAllMenus(); saveToCloud(); };
    document.getElementById('copyCloudBtn').onclick = () => { closeAllMenus(); makeCopyCloud(); };

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.context-menu')) hideContextMenu();
    });

    // Initialize
    document.title = state.appName;
    renderDateTabs();
    renderSchedule();
  </script>
</body>
</html>
